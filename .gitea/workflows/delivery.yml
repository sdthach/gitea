#
# The delivery fork's own CI, run by the local Gitea Actions instance (L10). A correct suite
# that no workflow runs is a defect, not a convenience to rely on (J12).
name: delivery

on:
  push:
    branches:
      - feat/deployenv
  pull_request:

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The spoke check diffs against the upstream pin, so the pin's commit must be
          # in the clone.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Units run on SQLite, Gitea's own default for test-backend, with no network and no
      # server (J10, J11, M9).
      - name: unit tests
        run: make delivery-test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Runs under Gitea's own tests/integration harness, so the fork's tests execute the
      # way upstream's do and survive a rebase (J8). Sub-2s locally (J11).
      - name: integration tests
        run: make delivery-integration

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Regenerating proves nothing about what is committed, so the gate is the diff (I16, J14).
      - name: generated artifacts match their source
        run: make delivery-generate-check
      - name: git diff gate
        run: |
          make delivery-generate
          git diff --exit-code
      # Every published endpoint has a CLI command (K7).
      - name: API and CLI parity
        run: make delivery-parity
      # Every upstream file the fork touches is a declared single-line spoke (F2, SC 16).
      - name: spoke count against the upstream pin
        run: make delivery-spoke-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./models/delivery/... ./services/delivery/... ./routers/api/delivery/... ./routers/web/delivery/... ./cmd/gitea-delivery/...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l models/delivery services/delivery routers/api/delivery routers/web/delivery cmd/gitea-delivery)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Suggested action: run 'make fmt' and commit the result."
            exit 1
          fi
