#
# The hub fork's own CI, run by the local Gitea Actions instance (L10). A correct suite
# that no workflow runs is a defect, not a convenience to rely on (J12).
name: hub

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The spoke check diffs against the upstream pin, so the pin's commit must be
          # in the clone.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Units run on SQLite, Gitea's own default for test-backend, with no network and no
      # server (J10, J11, M9).
      - name: unit tests
        run: make hub-test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Runs under Gitea's own tests/integration harness, so the fork's tests execute the
      # way upstream's do and survive a rebase (J8). Sub-2s locally (J11).
      - name: integration tests
        run: make hub-integration

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Regenerating proves nothing about what is committed, so the gate is the diff (I16, J14).
      - name: generated artifacts match their source
        run: make hub-generate-check
      - name: git diff gate
        run: |
          make hub-generate
          git diff --exit-code
      # Every published endpoint has a CLI command (K7).
      - name: API and CLI parity
        run: make hub-parity
      # Every upstream file the fork touches is a declared single-line spoke (F2, SC 16).
      - name: spoke count against the upstream pin
        run: make hub-spoke-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./models/hub/... ./models/deployments/... ./services/hub/... ./services/planning/... ./services/deployments/... ./routers/api/hub/... ./routers/api/planning/... ./routers/api/deployments/... ./routers/web/hub/... ./routers/web/planning/... ./routers/web/deployments/... ./cmd/hubcli/... ./cmd/gitea-planning/... ./cmd/gitea-deployments/...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l models/hub models/deployments services/hub services/planning services/deployments routers/api/hub routers/api/planning routers/api/deployments routers/web/hub routers/web/planning routers/web/deployments cmd/hubcli cmd/gitea-planning cmd/gitea-deployments)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Suggested action: run 'make fmt' and commit the result."
            exit 1
          fi
